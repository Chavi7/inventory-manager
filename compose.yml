# Dragon Technologies Inventory Manager - Module 2
# Deploy as a stack in Portainer.
services:
  inventory:
    build: .
    container_name: inventory-manager
    ports:
      # host:container. Defaults to localhost only.
      # The scan station runs on a classroom PC, so on the lab server either set
      # INVENTORY_BIND=0.0.0.0 (plain HTTP, USB scanner only) or keep localhost
      # and put a reverse proxy in front — the browser camera needs HTTPS from
      # a non-localhost origin. See docs/RUNBOOK.md.
      - "${INVENTORY_BIND:-127.0.0.1}:${INVENTORY_PORT:-5001}:5000"
    volumes:
      # Persists the SQLite database across container rebuilds.
      - inventory-data:/data
    environment:
      # INVENTORY_SECRET_KEY is pulled from .env — never commit the real value.
      - INVENTORY_SECRET_KEY=${INVENTORY_SECRET_KEY}
      - INVENTORY_DB_PATH=/data/inventory.db
      # CLOCKIN roster sync (optional — leave blank to keep CSV-only import).
      - CLOCKIN_URL=http://clockin:5000
      # Shared secret for the CLOCKIN roster sync API — must match
      # CLOCKIN_API_KEY set on the clockin container. Pulled from .env.
      - CLOCKIN_API_KEY=${CLOCKIN_API_KEY}
    restart: unless-stopped
    networks:
      - ctec-net

volumes:
  inventory-data:

networks:
  ctec-net:
    external: true
